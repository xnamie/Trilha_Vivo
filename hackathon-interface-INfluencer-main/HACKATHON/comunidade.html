<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunidade · Em construção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .build-wrap{max-width:900px;margin:26px auto;border-radius:var(--radius-xl);padding:34px;color:#fff;background:linear-gradient(135deg,var(--vivo-purple-dark),var(--vivo-purple),var(--vivo-purple-light));box-shadow:var(--shadow)}
  .build-title{margin-top:8px;font-size:30px}
  .build-desc{margin-top:10px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.92)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600}
</style>
</head>
<body>
<div class="main" style="min-height:100vh;">
  <header class="topbar">
    <a class="btn btn-secondary" href="index.html">Voltar ao Dashboard</a>
    <a class="btn btn-secondary" href="estagiario-dashboard.html">Dashboard Estagiário</a>
  </header>
  <main class="content">
    <section class="build-wrap">
      <span style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;">Conexão entre talentos</span>
      <h1 class="build-title">Comunidade</h1>
      <p class="build-desc">A comunidade oficial está em construção. Em breve haverá fóruns por tema, canais de mentoria, mural de vitórias e calendário colaborativo com encontros.</p>
      <div class="chips">
        <span class="chip">Fórum de dúvidas</span>
        <span class="chip">Salas por trilha</span>
        <span class="chip">Networking</span>
        <span class="chip">Eventos ao vivo</span>
      </div>
    </section>
  </main>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
